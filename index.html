<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Commons — CDSA 2026</title>
  <link rel="stylesheet" href="./styles.css?v=90c8e474" />
</head>
<body>
  <main id="app">
    <div id="stage-wrap">
      <div id="stage">
        <img id="manualPreview" alt="Current horizon image" style="position:absolute;left:0;width:100%;height:auto;z-index:2;pointer-events:none;display:none;" />
      </div>
      <div id="horizon-guide"></div>
    </div>

    <aside id="controls">
      <div class="row top-row">
        <strong>Liquid Commons — Horizon Calibration</strong>
        <div class="row">
          <button id="soundProxy">Start sound</button>
          <button id="playBtn">Playback</button>
          <button id="recordBtn">Record 58s</button>
        </div>
      </div>

      <div class="meta">
        <span id="counter"></span>
        <span id="filename"></span>
        <span id="recordStatus"></span>
      </div>

      <label>
        Horizon position in source image
        <input id="horizonSlider" type="range" min="0.15" max="0.85" step="0.001" value="0.5" />
        <output id="horizonValue">0.500</output>
      </label>

      <div class="row">
        <button id="prevBtn">Previous</button>
        <button id="nextBtn">Next</button>
      </div>

      <div class="row">
        <label class="compact">Duration (s)
          <input id="durationInput" type="number" min="12" max="180" step="1" value="58" />
        </label>
        <label class="compact">Morph
          <input id="morphInput" type="range" min="0" max="0.12" step="0.002" value="0.030" />
          <output id="morphValue">0.030</output>
        </label>
      </div>

      <p class="hint">Move the slider until the real horizon matches the red line. Values are saved automatically in this browser. Playback runs one seamless 58-second loop.</p>
    </aside>

    <button id="exitPlayback" class="hidden">Exit playback</button>
  </main>

  <script type="module" src="./app.js?v=90c8e474"></script>
  <script>
    const preview = document.querySelector('#manualPreview');
    const stage = document.querySelector('#stage');
    const filenameEl = document.querySelector('#filename');
    const sliderEl = document.querySelector('#horizonSlider');
    const playEl = document.querySelector('#playBtn');
    const exitEl = document.querySelector('#exitPlayback');

    function positionPreview() {
      if (!preview.naturalWidth || !preview.naturalHeight || document.body.classList.contains('playback')) return;
      const renderedHeight = stage.clientWidth * preview.naturalHeight / preview.naturalWidth;
      const horizon = Number(sliderEl.value || 0.5);
      preview.style.top = `${stage.clientHeight / 2 - horizon * renderedHeight}px`;
      preview.style.display = 'block';
    }

    function syncPreview() {
      const file = filenameEl.textContent.trim();
      if (!file || document.body.classList.contains('playback')) return;
      const nextSrc = `./public/images/${encodeURIComponent(file)}`;
      if (!preview.src.endsWith(nextSrc)) preview.src = nextSrc;
      else positionPreview();
    }

    preview.addEventListener('load', positionPreview);
    sliderEl.addEventListener('input', positionPreview);
    window.addEventListener('resize', positionPreview);

    new MutationObserver(syncPreview).observe(filenameEl, { childList: true, characterData: true, subtree: true });

    playEl.addEventListener('click', () => { preview.style.display = 'none'; });
    exitEl.addEventListener('click', () => { setTimeout(syncPreview, 0); });

    setTimeout(syncPreview, 500);
  </script>
</body>
</html>
