<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Commons — CDSA 2026</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app">
    <div id="stage-wrap">
      <div id="stage"></div>
      <div id="horizon-guide"></div>
    </div>

    <aside id="controls">
      <div class="row top-row">
        <strong>Liquid Commons — Horizon Calibration</strong>
        <div class="row">
          <button id="soundProxy">Start sound</button>
          <button id="playBtn">Playback</button>
          <button id="recordBtn">Record 58s</button>
        </div>
      </div>

      <div class="meta">
        <span id="counter"></span>
        <span id="filename"></span>
        <span id="recordStatus"></span>
      </div>

      <label>
        Horizon position in source image
        <input id="horizonSlider" type="range" min="0.15" max="0.85" step="0.001" value="0.5" />
        <output id="horizonValue">0.500</output>
      </label>

      <div class="row">
        <button id="prevBtn">Previous</button>
        <button id="nextBtn">Next</button>
      </div>

      <div class="row">
        <label class="compact">Duration (s)
          <input id="durationInput" type="number" min="12" max="180" step="1" value="58" />
        </label>
        <label class="compact">Morph
          <input id="morphInput" type="range" min="0" max="0.12" step="0.002" value="0.030" />
          <output id="morphValue">0.030</output>
        </label>
      </div>

      <p class="hint">Move the slider until the real horizon matches the red line. Values are saved automatically in this browser. Playback runs one seamless 58-second loop.</p>
    </aside>

    <button id="exitPlayback" class="hidden">Exit playback</button>
  </main>

  <script type="module" src="./app.js"></script>
  <script>
    const proxy = document.querySelector('#soundProxy');
    proxy.addEventListener('click', () => {
      const realButton = document.querySelector('button[aria-label="Toggle sound"]');
      if (!realButton) {
        proxy.textContent = 'Sound loading…';
        setTimeout(() => {
          const retry = document.querySelector('button[aria-label="Toggle sound"]');
          if (retry) retry.click();
        }, 250);
        return;
      }
      realButton.click();
      setTimeout(() => {
        proxy.textContent = realButton.textContent === 'Sound: on' ? 'Sound: off' : 'Start sound';
      }, 500);
    });
  </script>
</body>
</html>
