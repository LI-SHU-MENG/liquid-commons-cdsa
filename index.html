<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Commons — CDSA 2026</title>
  <link rel="stylesheet" href="./styles.css?v=2d156110" />
</head>
<body>
  <main id="app">
    <div id="stage-wrap">
      <div id="stage">
        <img id="manualPreview" alt="Current horizon image" />
        <div id="crop-band"></div>
        <div id="horizon-guide"></div>
      </div>
    </div>

    <aside id="controls">
      <div class="row top-row">
        <strong>Liquid Commons — Horizon Calibration</strong>
        <div class="row">
          <button id="soundProxy">Start long tone</button>
          <button id="playBtn">Playback</button>
          <button id="recordBtn">Record 58s</button>
        </div>
      </div>

      <div class="meta">
        <span id="counter"></span>
        <span id="filename"></span>
        <span id="recordStatus"></span>
      </div>

      <label>
        Horizon position in source image
        <input id="horizonSlider" type="range" min="0.15" max="0.85" step="0.001" value="0.5" />
        <output id="horizonValue">0.500</output>
      </label>

      <div class="row">
        <button id="prevBtn">Previous</button>
        <button id="nextBtn">Next</button>
      </div>

      <div class="row">
        <label class="compact">Duration (s)
          <input id="durationInput" type="number" min="12" max="180" step="1" value="58" />
        </label>
        <label class="compact">Morph
          <input id="morphInput" type="range" min="0" max="0.12" step="0.002" value="0.030" />
          <output id="morphValue">0.030</output>
        </label>
      </div>

      <div id="soundMonitor" style="display:grid;grid-template-columns:1fr;gap:8px 14px;padding:10px 12px;border:1px solid #2a3038;border-radius:10px;background:#0c1015;font-size:12px;line-height:1.45;">
        <div><strong>HORIZON — LOW BRASS LONG TONE</strong><br>Start the long tone to analyse the horizon.</div>
      </div>

      <p class="hint">Full source image shown for calibration. Red line = calibrated horizon. White translucent band = final 7680 × 856 crop.</p>
    </aside>

    <button id="exitPlayback" class="hidden">Exit playback</button>
  </main>

  <script type="module" src="./app.js?v=27218500"></script>
  <script type="module" src="./music-engine.js?v=b614d028"></script>
  <script>
    const preview = document.querySelector('#manualPreview');
    const cropBand = document.querySelector('#crop-band');
    const guide = document.querySelector('#horizon-guide');
    const stage = document.querySelector('#stage');
    const filenameEl = document.querySelector('#filename');
    const sliderEl = document.querySelector('#horizonSlider');
    const playEl = document.querySelector('#playBtn');
    const exitEl = document.querySelector('#exitPlayback');
    const TARGET_ASPECT = 7680 / 856;

    function layoutCalibration() {
      if (!preview.naturalWidth || !preview.naturalHeight || document.body.classList.contains('playback')) return;
      const sw = stage.clientWidth;
      const sh = stage.clientHeight;
      const imageAspect = preview.naturalWidth / preview.naturalHeight;
      let displayW, displayH;
      if (sw / sh > imageAspect) { displayH = sh; displayW = displayH * imageAspect; }
      else { displayW = sw; displayH = displayW / imageAspect; }
      const left = (sw - displayW) / 2;
      const top = (sh - displayH) / 2;
      const horizon = Number(sliderEl.value || 0.5);
      const horizonY = top + horizon * displayH;
      const cropH = displayW / TARGET_ASPECT;
      const cropTop = horizonY - cropH / 2;
      preview.style.left = `${left}px`;
      preview.style.top = `${top}px`;
      preview.style.width = `${displayW}px`;
      preview.style.height = `${displayH}px`;
      preview.style.display = 'block';
      cropBand.style.left = `${left}px`;
      cropBand.style.top = `${cropTop}px`;
      cropBand.style.width = `${displayW}px`;
      cropBand.style.height = `${cropH}px`;
      cropBand.style.display = 'block';
      guide.style.left = `${left}px`;
      guide.style.top = `${horizonY - 1}px`;
      guide.style.width = `${displayW}px`;
      guide.style.display = 'block';
    }

    function syncPreview() {
      const file = filenameEl.textContent.trim();
      if (!file || document.body.classList.contains('playback')) return;
      preview.src = encodeURI(`./public/images/${file}`);
    }

    preview.addEventListener('load', layoutCalibration);
    preview.addEventListener('error', () => { preview.style.display='none'; cropBand.style.display='none'; guide.style.display='none'; });
    sliderEl.addEventListener('input', layoutCalibration);
    window.addEventListener('resize', layoutCalibration);
    new MutationObserver(syncPreview).observe(filenameEl, { childList:true, characterData:true, subtree:true });
    playEl.addEventListener('click', () => { preview.style.display='none'; cropBand.style.display='none'; guide.style.display='none'; });
    exitEl.addEventListener('click', () => { setTimeout(syncPreview,0); });
    setTimeout(syncPreview,500);
  </script>
</body>
</html>
